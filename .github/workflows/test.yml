name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov sympy
          # 安装项目包
          pip install -e . 2>/dev/null || true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=utils --cov-report=term-missing

      - name: Verify imports
        run: |
          python -c "from utils.rewards import format_reward, anomaly_reward, correctness_reward; print('✅ utils.rewards')"
          python -c "from utils.schema import SFTDataFormatter, RLDataFormatter; print('✅ utils.schema')"